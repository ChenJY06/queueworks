[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queueworks"
version = "0.1.0"
description = "A durable SQLite job queue with an HTTP coordinator and independent workers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "Pillow==11.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[project.scripts]
queueworks = "queueworks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: launches real HTTP coordinator and worker processes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
